[build]
# Ensure environment variables are available during build
# This allows Supabase clients to be initialized at module level

[deploy]
startCommand = "npm run start"

# THIS FILE APPLIES TO THE WEB SERVICE (autoura-saas / getautoura.net).
#
# ⚠️ Every service built from this repo reads THIS file by default, and a
# startCommand set here OVERRIDES the dashboard — the field shows greyed out
# with "The value is set in /railway.toml". A cron service created from this
# repo therefore inherits `npm run start` and boots a Next.js server that
# never exits: the run hangs in "Running", the job never fires, and Railway
# bills for another web server.
#
# Each cron service must be pointed at its OWN config file via
# Settings → Config-as-code → Railway Config File:
#
#   Service              Config file                          Cron (UTC)
#   -------------------  -----------------------------------  ----------
#   Exchange rates       railway.cron-exchange-rates.toml      0 1 * * *
#   Agent memory         railway.cron-agent-memory.toml        0 2 * * *
#
# Railway has no `[[cron]]` table — the schedule is set per-service in the
# dashboard and runs that service's START COMMAND, which must exit when done.
# Env on each cron service: APP_URL, CRON_SECRET (CRON_SECRET must match this
# service's value, or the endpoint 401s). Full setup + verification:
# docs/CRON-JOBS.md
#
# The old inert `[[cron]]` block was removed (wrong syntax + it single-quoted
# $CRON_SECRET so the secret never expanded).
