# =====================================================================
# Railway config — "Agent memory cron" SERVICE ONLY
# =====================================================================
# Point the cron service at this file:
#   Service → Settings → Config-as-code → Railway Config File
#   → railway.cron-agent-memory.toml
#
# See railway.cron-exchange-rates.toml for why each cron service needs its own
# file: railway.toml's `startCommand = "npm run start"` is inherited by every
# service built from this repo and cannot be overridden in the dashboard.
# =====================================================================

[deploy]
# Must EXIT when finished — Railway records the run from the exit code.
# scripts/cron-agent-memory.mjs exits 0 on success (including a quiet night
# with nothing to process) and 1 when runs were found but failed to process.
startCommand = "npm run cron:agent-memory"
