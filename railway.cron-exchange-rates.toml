# =====================================================================
# Railway config — "cron:exchange-rates" SERVICE ONLY
# =====================================================================
# Point the cron service at this file:
#   Service → Settings → Config-as-code → Railway Config File
#   → railway.cron-exchange-rates.toml
#
# WHY A SEPARATE FILE
# -------------------
# Every service deployed from this repo reads railway.toml by default, and a
# start command set in config-as-code OVERRIDES the dashboard — the field is
# greyed out, showing "The value is set in /railway.toml".
#
# So a cron service created from this repo silently inherited the web
# service's `startCommand = "npm run start"` and booted a Next.js server that
# never exits: the run sat in "Running" indefinitely, the job never fired, and
# Railway was billing for a third web server. Overriding it in the dashboard
# was impossible.
#
# Each cron service therefore gets its own config file. Only `startCommand` is
# pinned here; the cron schedule and restart policy stay editable in the
# dashboard so they can be changed without a deploy.
# =====================================================================

[deploy]
# Must EXIT when finished — Railway records the run from the exit code.
# scripts/cron-exchange-rates.mjs exits 0 on success, 1 when the rate-history
# write was lost (a 200 that is really a failure).
startCommand = "npm run cron:exchange-rates"
