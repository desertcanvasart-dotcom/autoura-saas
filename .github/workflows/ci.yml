name: CI

# Enforces the pricing harness (and the rest of the codebase) on every PR:
# the test suite + a strict type-check must pass before merge.
on:
  pull_request:
    branches: [main]
    # `edited` is here for ONE reason: retargeting a PR's base branch.
    #
    # The default types are [opened, synchronize, reopened]. None of them fire
    # when a PR's base changes, and `branches: [main]` is evaluated against the
    # base at event time — so a PR opened against another branch (the usual
    # shape of a stacked PR) is filtered out at open, and retargeting it to
    # main fires only `edited`, which was not subscribed.
    #
    # The result was a PR sitting at mergeStateStatus CLEAN with zero checks
    # ever executed: `gh pr checks` reported "no checks reported" rather than a
    # failure, and nothing about the PR looked untested. PR #175 merged that
    # way on 2026-08-23 (CI was run by hand first). Every stacked PR had this
    # hole — parent tested, child silently not.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + type-check
    # NOTE: do NOT add `if: github.event.changes.base != null` here to skip the
    # title/body edits that `edited` also fires for. It looks like a free
    # saving and it is not: a skipped job still publishes a check run under
    # this name, and it supersedes the previous one on the same SHA. A red
    # build could then be turned green by editing the PR description —
    # `gh pr checks` reports "skipping", and branch protection counts a
    # skipped required check as satisfied. Measured on PR #176, 2026-08-23.
    #
    # A prose edit therefore costs one full run. That is the price of the
    # check on a PR always being a real result.
    runs-on: ubuntu-latest
    env:
      # Tests/tsc don't use Puppeteer's bundled browser — skip the slow download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Credentials for the writing E2E journey. Declared at job level on
      # purpose: `secrets` is NOT an available context in a step-level `if`,
      # but `env` is — so the presence check below has to read these, not the
      # secrets directly. Absent secrets expand to '', and the journey steps
      # skip. See docs/E2E.md.
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Lint ratchet
        # Standing debt is too large for a blocking gate (16,899 problems on
        # 2026-07-14) — instead, fail only if error/warning counts GROW past
        # scripts/lint-baseline.json. Pay debt down, then lock it in with
        # `npm run lint:ratchet -- --update`.
        run: npm run lint:ratchet

      - name: Generate Next route types
        # `next typegen` produces .next/types without a build (no env vars, no
        # prerender) — all the full type-check needs on a fresh checkout.
        run: npx next typegen

      - name: Type-check (full app)
        # FULL tsc, not a scoped subset — same change as travel-ops-pro
        # 2026-07-14: the scoped check structurally cannot catch app-code type
        # errors (proven there by a regression that merged with green CI).
        run: NODE_OPTIONS=--max-old-space-size=4096 npx tsc --noEmit

      - name: Production build (env-less)
        # Catches module-scope env crashes that only surface during `next
        # build`'s page-data collection — this exact class broke the Railway
        # deploy on 2026-07-14 (a route constructed its Supabase client at
        # import with SUPABASE_SERVICE_ROLE_KEY!). The codebase's build-safe
        # convention (lazy/mock clients) makes an env-less build possible;
        # this step keeps it that way.
        run: NODE_OPTIONS=--max-old-space-size=4096 npx next build

      - name: Install Playwright browser
        # Chromium only: the smoke suite is one project, and the full
        # `--with-deps` install of three engines costs minutes per run.
        run: npx playwright install chromium --with-deps

      - name: E2E smoke (auth boundary)
        # Real requests against `next start`, so this catches what source-
        # reading tests structurally cannot: a middleware that never ran for a
        # path. Database-free and unauthenticated by design — placeholder
        # Supabase env is enough, because every assertion here is about
        # refusal. Authenticated journeys need a dedicated throwaway project;
        # see docs/E2E.md.
        run: npm run test:e2e

      - name: Seed the E2E fixture tenant
        # Skipped until the throwaway project's secrets exist (docs/E2E.md).
        # The script refuses to seed a project that holds non-fixture tenants,
        # and marks the tenant settings.e2e_fixture — which the journey spec
        # then requires. Without that marker the spec will not write anywhere.
        id: e2e_tenant
        if: env.E2E_SUPABASE_URL != ''
        run: echo "tenant_id=$(node scripts/seed-e2e-tenant.mjs)" >> "$GITHUB_OUTPUT"

      - name: E2E portal journey (writes — fixture tenant only)
        # The customer-facing surfaces proven end to end: confirmation gate,
        # traveller details, per-traveller private links, document upload into
        # the private bucket, change requests, and the share-page chat landing
        # in a staff conversation. Skips itself when the secrets are absent.
        if: env.E2E_SUPABASE_URL != ''
        env:
          E2E_TENANT_ID: ${{ steps.e2e_tenant.outputs.tenant_id }}
        run: npx playwright test e2e/portal-journey.spec.ts

      - name: Bundle budget
        # Gzipped client-JS ceilings (scripts/check-bundle-budget.mjs) —
        # catches a heavy dependency landing in client chunks. On overage,
        # `npm run analyze` shows what grew; budgets may only be raised
        # deliberately, in the PR that justifies the growth.
        run: npm run check:bundle
