name: CI

# Enforces the pricing harness (and the rest of the codebase) on every PR:
# the test suite + a strict type-check must pass before merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + type-check
    runs-on: ubuntu-latest
    env:
      # Tests/tsc don't use Puppeteer's bundled browser — skip the slow download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Generate Next route types
        # `next typegen` produces .next/types without a build (no env vars, no
        # prerender) — all the full type-check needs on a fresh checkout.
        run: npx next typegen

      - name: Type-check (full app)
        # FULL tsc, not a scoped subset — same change as travel-ops-pro
        # 2026-07-14: the scoped check structurally cannot catch app-code type
        # errors (proven there by a regression that merged with green CI).
        run: NODE_OPTIONS=--max-old-space-size=4096 npx tsc --noEmit

      - name: Production build (env-less)
        # Catches module-scope env crashes that only surface during `next
        # build`'s page-data collection — this exact class broke the Railway
        # deploy on 2026-07-14 (a route constructed its Supabase client at
        # import with SUPABASE_SERVICE_ROLE_KEY!). The codebase's build-safe
        # convention (lazy/mock clients) makes an env-less build possible;
        # this step keeps it that way.
        run: NODE_OPTIONS=--max-old-space-size=4096 npx next build
